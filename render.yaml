services:
  - type: web
    name: mycelia
    env: node
    plan: free
    buildCommand: echo "No build required"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: RG_DB_FILE
        value: /data/researchgraph.db
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
    disk:
      name: mycelia-data
      mountPath: /data
      sizeGB: 1
